<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenCode Trajectory</title>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --panel-2: #fbfcfd;
    --border: #e3e6ec;
    --border-strong: #cfd5df;
    --text: #1b1f27;
    --muted: #67707f;
    --faint: #96a0b0;
    --accent: #2f6feb;
    --accent-soft: #eaf1fe;
    --tool: #0f766e;
    --tool-soft: #e6f5f3;
    --reason: #7c3aed;
    --reason-soft: #f2ebfe;
    --error: #d92d20;
    --error-soft: #fdecea;
    --warn: #b45309;
    --warn-soft: #fef3e2;
    --ok: #15803d;
    --user: #1d4ed8;
    --user-soft: #eef3ff;
    --radius: 10px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1a1e25; --panel-2: #1f242c; --border: #2a3038; --border-strong: #3a424e;
      --text: #e6e9ef; --muted: #9aa4b4; --faint: #6f7b8c;
      --accent: #6c9bff; --accent-soft: #1c2740;
      --tool: #4fd1c5; --tool-soft: #10312f;
      --reason: #b18cff; --reason-soft: #241c3a;
      --error: #ff7b72; --error-soft: #3a1d1b;
      --warn: #f0b64f; --warn-soft: #3a2c14;
      --ok: #5ecb8a; --user: #8ab4ff; --user-soft: #17243d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }

  #app { display: grid; grid-template-columns: 300px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; height: 100vh; }

  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: baseline; gap: 8px; font-weight: 650; letter-spacing: -0.01em; }
  .brand small { font-weight: 400; color: var(--faint); font-size: 11px; font-family: var(--mono); }
  .path { font-family: var(--mono); font-size: 11px; color: var(--faint); max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats { display: flex; gap: 14px; margin-left: auto; flex-wrap: wrap; }
  .stat { display: flex; align-items: baseline; gap: 5px; font-size: 12px; color: var(--muted); }
  .stat b { font-size: 13px; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat.bad b { color: var(--error); }
  .btn {
    padding: 5px 11px; border-radius: 7px; border: 1px solid var(--border-strong);
    background: var(--panel-2); font-size: 12.5px; color: var(--muted);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  aside { border-right: 1px solid var(--border); background: var(--panel); overflow-y: auto; padding: 10px; }
  .side-head { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 6px 8px 8px; display: flex; justify-content: space-between; }
  .sess {
    padding: 9px 10px; border-radius: var(--radius); cursor: pointer; border: 1px solid transparent;
    margin-bottom: 3px;
  }
  .sess:hover { background: var(--panel-2); }
  .sess.active { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .sess .t { font-size: 13px; font-weight: 550; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sess .m { display: flex; gap: 8px; margin-top: 4px; font-size: 11px; color: var(--faint); font-family: var(--mono); flex-wrap: wrap; }
  .sess .m .e { color: var(--error); }
  .sess .m .w { color: var(--warn); }
  .child { margin-left: 14px; border-left: 2px solid var(--border); padding-left: 6px; }

  main { overflow-y: auto; padding: 18px 22px 96px; }
  .empty { color: var(--faint); text-align: center; margin-top: 18vh; line-height: 2; }
  .empty code { font-family: var(--mono); background: var(--panel); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--border); }

  .toolbar { position: sticky; top: -18px; z-index: 5; background: linear-gradient(var(--bg) 82%, transparent); padding: 4px 0 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: -4px 0 6px; }
  .chip { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border-strong); font-size: 12px; color: var(--muted); background: var(--panel); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .search { flex: 1 1 180px; min-width: 140px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); font-size: 13px; }
  .search:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: -1px; border-color: var(--accent); }

  .msg { margin: 0 0 18px; }
  .msg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 11.5px; color: var(--faint); font-family: var(--mono); flex-wrap: wrap; }
  .role { font-weight: 650; font-family: inherit; letter-spacing: .02em; text-transform: uppercase; font-size: 10.5px; padding: 2px 7px; border-radius: 5px; }
  .role.user { background: var(--user-soft); color: var(--user); }
  .role.assistant { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
  .msg-head .sep { color: var(--border-strong); }
  .msg.user .body { background: var(--user-soft); border: 1px solid color-mix(in srgb, var(--user) 22%, transparent); border-radius: var(--radius); padding: 11px 14px; }

  .part { margin: 9px 0; }
  .txt { white-space: pre-wrap; word-break: break-word; }
  .txt p { margin: 0 0 .6em; }
  .txt p:last-child { margin-bottom: 0; }
  .txt pre {
    margin: .6em 0; padding: 10px 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.5;
  }
  .txt code { font-family: var(--mono); font-size: .92em; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; }
  .txt pre code { background: none; border: none; padding: 0; font-size: inherit; }

  .fold-head { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; padding: 5px 9px; border-radius: 7px; }
  .fold-head:hover { background: var(--panel-2); }
  .fold-head .caret { width: 9px; color: var(--faint); transition: transform .12s; font-size: 10px; }
  .fold-head.open .caret { transform: rotate(90deg); }
  .reason .fold-head { color: var(--reason); font-size: 12.5px; font-weight: 550; background: var(--reason-soft); }
  .reason .fold-head .hint { color: var(--faint); font-weight: 400; font-family: var(--mono); font-size: 11px; }
  .reason .body { border-left: 2px solid color-mix(in srgb, var(--reason) 30%, transparent); margin: 4px 0 0 14px; padding: 2px 0 2px 12px; color: var(--muted); font-size: 13px; }

  .tool { border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
  .tool.err { border-color: color-mix(in srgb, var(--error) 45%, transparent); }
  .tool-run { border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .tool-head { display: flex; align-items: center; gap: 9px; padding: 8px 11px; cursor: pointer; }
  .tool-head:hover { background: var(--panel-2); }
  .tbadge {
    width: 26px; height: 26px; flex: none; border-radius: 7px; display: grid; place-items: center;
    background: var(--tool-soft); color: var(--tool); font-family: var(--mono); font-size: 10.5px; font-weight: 700;
    letter-spacing: -0.03em;
  }
  .tool.err .tbadge { background: var(--error-soft); color: var(--error); }
  .tname { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--tool); }
  .ttitle { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .tmeta { display: flex; gap: 7px; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--faint); flex: none; }
  .pill { padding: 1px 6px; border-radius: 999px; font-size: 10.5px; }
  .pill.ok { background: var(--tool-soft); color: var(--ok); }
  .pill.bad { background: var(--error-soft); color: var(--error); }
  .pill.run { background: var(--warn-soft); color: var(--warn); }
  .tool-body { border-top: 1px solid var(--border); padding: 10px 12px; background: var(--panel-2); }
  .sec { margin-bottom: 10px; }
  .sec:last-child { margin-bottom: 0; }
  .sec-h { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
  .pre {
    margin: 0; padding: 9px 11px; background: var(--panel); border: 1px solid var(--border); border-radius: 7px;
    font-family: var(--mono); font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    max-height: 340px; overflow: auto;
  }
  .pre.clip { border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .copy { font-size: 10.5px; color: var(--faint); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; }
  .copy:hover { color: var(--accent); border-color: var(--accent); }

  .step-line { display: flex; align-items: center; gap: 10px; margin: 14px 0 4px; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .step-line::before, .step-line::after { content: ""; height: 1px; background: var(--border); flex: 1; }

  .note { border-radius: 8px; padding: 8px 11px; font-size: 12.5px; display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; }
  .note .tag { font-family: var(--mono); font-size: 10.5px; font-weight: 700; flex: none; padding-top: 1px; }
  .note.err { background: var(--error-soft); color: var(--error); }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .note.info { background: var(--accent-soft); color: var(--accent); }
  .note .detail { color: var(--text); opacity: .85; font-family: var(--mono); font-size: 11.5px; }
  .note .detail pre { margin: 4px 0 0; white-space: pre-wrap; }

  .subtask { border: 1px dashed color-mix(in srgb, var(--reason) 45%, transparent); border-radius: var(--radius); padding: 9px 12px; background: var(--reason-soft); }
  .subtask .h { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--reason); font-weight: 600; }
  .subtask .p { margin-top: 5px; font-size: 12.5px; color: var(--muted); white-space: pre-wrap; max-height: 140px; overflow: auto; }

  .more { font-size: 12px; color: var(--accent); padding: 2px 0; }
  .hidden { display: none !important; }

  .waterfall { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 16px; }
  .waterfall .lbl { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-bottom: 7px; display: flex; justify-content: space-between; }
  .wf-row { display: grid; grid-template-columns: 84px 1fr 62px; gap: 8px; align-items: center; font-family: var(--mono); font-size: 11px; margin-bottom: 2px; }
  .wf-row .n { color: var(--tool); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wf-track { height: 11px; background: var(--panel-2); border-radius: 3px; position: relative; overflow: hidden; }
  .wf-bar { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--tool) 70%, transparent); border-radius: 3px; min-width: 2px; }
  .wf-bar.bad { background: color-mix(in srgb, var(--error) 70%, transparent); }
  .wf-row .d { text-align: right; color: var(--faint); }
  .waterfall .more { margin-top: 6px; }

  kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }

  /* =========================== trajectory stream ===========================
     One event per line, tagged by origin. This is the audit view: density and
     alignment matter more than prose, so the whole block is monospaced and the
     columns are fixed so the eye can scan vertically. */
  :root {
    --src-user: #2563eb;      --src-user-bg: #e8efff;
    --src-assistant: #475569; --src-assistant-bg: #eef1f5;
    --src-reasoning: #7c3aed; --src-reasoning-bg: #f2ebfe;
    --src-llm: #0e7490;       --src-llm-bg: #e2f4f9;
    --src-tool: #0f766e;      --src-tool-bg: #e3f4f1;
    --src-result: #15803d;    --src-result-bg: #e8f6ec;
    --src-system: #b45309;    --src-system-bg: #fef3e2;
    --src-subagent: #a21caf;  --src-subagent-bg: #fbeafd;
    --src-error: #b91c1c;     --src-error-bg: #fdeceb;
    --src-perm: #c2410c;      --src-perm-bg: #fdeee5;
    --src-file: #0369a1;      --src-file-bg: #e5f2fb;
    --src-harness: #6b7280;   --src-harness-bg: #f1f2f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --src-user: #8ab4ff;      --src-user-bg: #17243d;
      --src-assistant: #b6c0cf; --src-assistant-bg: #232a34;
      --src-reasoning: #b18cff; --src-reasoning-bg: #241c3a;
      --src-llm: #6fd2e8;       --src-llm-bg: #10303a;
      --src-tool: #4fd1c5;      --src-tool-bg: #10312f;
      --src-result: #6ddc9b;    --src-result-bg: #112e1d;
      --src-system: #f0b64f;    --src-system-bg: #3a2c14;
      --src-subagent: #e17ce8;  --src-subagent-bg: #331634;
      --src-error: #ff7b72;     --src-error-bg: #3a1d1b;
      --src-perm: #ffa06b;      --src-perm-bg: #3a2318;
      --src-file: #7cc4f0;      --src-file-bg: #12293a;
      --src-harness: #9aa4b4;   --src-harness-bg: #242830;
    }
  }

  .vswitch { display: flex; gap: 2px; padding: 2px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; }
  .vswitch button { padding: 4px 11px; border-radius: 6px; font-size: 12.5px; color: var(--muted); }
  .vswitch button.on { background: var(--panel); color: var(--accent); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .stream { margin: 0 -22px; border-top: 1px solid var(--border); }
  .ev {
    display: grid; grid-template-columns: 34px 74px 58px minmax(0, 1fr) auto;
    align-items: center; gap: 9px;
    padding: 0 22px 0 19px; min-height: 27px;
    font-family: var(--mono); font-size: 12px; line-height: 1.5;
    border-left: 3px solid transparent;
    cursor: pointer;
  }
  .ev:hover { background: var(--panel-2); }
  .ev.on { background: var(--accent-soft); border-left-color: var(--accent); }
  .ev .seq { color: var(--faint); font-size: 10.5px; text-align: right; font-variant-numeric: tabular-nums; }
  .ev .tm { color: var(--faint); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .ev .tag {
    font-size: 9.5px; font-weight: 700; letter-spacing: .04em; text-align: center;
    padding: 1px 0; border-radius: 4px; text-transform: uppercase;
  }
  .ev .bd { min-width: 0; display: flex; align-items: baseline; gap: 7px; overflow: hidden; }
  .ev .tx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
  .ev .nt { color: var(--faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; max-width: 44%; min-width: 0; }
  .ev .mt { display: flex; gap: 6px; align-items: center; font-size: 10.5px; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
  .ev .dur { min-width: 44px; text-align: right; }
  .ev.dim { opacity: .42; }
  /* A turn boundary is the only structural break in an otherwise flat stream. */
  .ev.turn { border-top: 1px solid var(--border); margin-top: 5px; }

  .tag.src-user { color: var(--src-user); background: var(--src-user-bg); }
  .tag.src-assistant { color: var(--src-assistant); background: var(--src-assistant-bg); }
  .tag.src-reasoning { color: var(--src-reasoning); background: var(--src-reasoning-bg); }
  .tag.src-llm { color: var(--src-llm); background: var(--src-llm-bg); }
  .tag.src-tool { color: var(--src-tool); background: var(--src-tool-bg); }
  .tag.src-result { color: var(--src-result); background: var(--src-result-bg); }
  .tag.src-system { color: var(--src-system); background: var(--src-system-bg); }
  .tag.src-subagent { color: var(--src-subagent); background: var(--src-subagent-bg); }
  .tag.src-error { color: var(--src-error); background: var(--src-error-bg); }
  .tag.src-perm { color: var(--src-perm); background: var(--src-perm-bg); }
  .tag.src-file { color: var(--src-file); background: var(--src-file-bg); }
  .tag.src-harness { color: var(--src-harness); background: var(--src-harness-bg); }

  /* row tint by origin: a 3px rail lets the eye trace where time went */
  .ev.src-user { border-left-color: color-mix(in srgb, var(--src-user) 55%, transparent); }
  .ev.src-assistant { border-left-color: color-mix(in srgb, var(--src-assistant) 45%, transparent); }
  .ev.src-reasoning { border-left-color: color-mix(in srgb, var(--src-reasoning) 45%, transparent); }
  .ev.src-llm { border-left-color: color-mix(in srgb, var(--src-llm) 45%, transparent); }
  .ev.src-tool { border-left-color: color-mix(in srgb, var(--src-tool) 55%, transparent); }
  .ev.src-result { border-left-color: color-mix(in srgb, var(--src-result) 50%, transparent); }
  .ev.src-system { border-left-color: color-mix(in srgb, var(--src-system) 50%, transparent); }
  .ev.src-subagent { border-left-color: color-mix(in srgb, var(--src-subagent) 50%, transparent); }
  .ev.src-error { border-left-color: color-mix(in srgb, var(--src-error) 55%, transparent); }
  .ev.src-perm { border-left-color: color-mix(in srgb, var(--src-perm) 50%, transparent); }
  .ev.src-file { border-left-color: color-mix(in srgb, var(--src-file) 50%, transparent); }
  .ev.src-harness { border-left-color: color-mix(in srgb, var(--src-harness) 40%, transparent); }
  .ev.on { border-left-color: var(--accent) !important; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 100%; }
  .chip .n { color: var(--faint); font-size: 10.5px; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .chip.on .n { color: rgba(255,255,255,.72); }

  /* ------------------------------ drawer ------------------------------ */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 46vw);
    background: var(--panel); border-left: 1px solid var(--border-strong);
    box-shadow: -12px 0 32px rgba(0,0,0,.10);
    display: flex; flex-direction: column; z-index: 40;
    transform: translateX(100%); transition: transform .16s ease;
  }
  .drawer.open { transform: none; }
  .drawer .dh { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .drawer .dh .k { font-family: var(--mono); font-size: 12.5px; font-weight: 650; }
  .drawer .dh .x { margin-left: auto; color: var(--faint); font-size: 18px; line-height: 1; padding: 0 4px; }
  .drawer .dh .x:hover { color: var(--error); }
  .drawer .db { overflow-y: auto; padding: 12px 14px 28px; }
  .kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 2px 10px; font-family: var(--mono); font-size: 11.5px; margin-bottom: 12px; }
  .kv dt { color: var(--faint); }
  .kv dd { margin: 0; word-break: break-all; color: var(--text); }
  .kv dd.copyable { cursor: pointer; }
  .kv dd.copyable:hover { color: var(--accent); }

  .js { font-family: var(--mono); font-size: 11.5px; line-height: 1.65; }
  .js .row { display: flex; gap: 6px; padding-left: 0; }
  .js .row > .caret { width: 9px; color: var(--faint); cursor: pointer; user-select: none; flex: none; }
  .js .row > .caret:hover { color: var(--accent); }
  .js .k { color: var(--src-llm); }
  .js .s { color: var(--src-result); word-break: break-word; }
  .js .n { color: var(--src-perm); }
  .js .b { color: var(--src-reasoning); }
  .js .z { color: var(--faint); }
  .js .kids { margin-left: 14px; border-left: 1px solid var(--border); padding-left: 6px; }
  .js .folded { color: var(--faint); font-size: 10.5px; }

  /* ------------------------------ replay ------------------------------ */
  .replaybar {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; background: var(--panel); border-top: 1px solid var(--border);
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
  }
  .replaybar .pl {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border-strong);
    display: grid; place-items: center; color: var(--accent); flex: none;
  }
  .replaybar .pl:hover { background: var(--accent-soft); }
  .replaybar input[type=range] { flex: 1 1 auto; accent-color: var(--accent); height: 3px; }
  .replaybar .sp { display: flex; gap: 2px; }
  .replaybar .sp button { padding: 2px 6px; border-radius: 4px; font-size: 11px; color: var(--faint); }
  .replaybar .sp button.on { background: var(--accent-soft); color: var(--accent); }
  .replaybar .cnt { flex: none; color: var(--faint); min-width: 84px; text-align: right; }

  @media (max-width: 1080px) {
    #app { grid-template-columns: 228px minmax(0, 1fr); }
    .ev { grid-template-columns: 30px 60px 54px minmax(0, 1fr) auto; gap: 7px; padding-left: 10px; padding-right: 12px; }
    .stream { margin: 0 -14px; }
    main { padding: 14px 14px 80px; }
  }
  @media (max-width: 820px) {
    .ev { grid-template-columns: 28px 50px minmax(0, 1fr) auto; }
    .ev .tm { display: none; }
    .drawer { width: 100vw; }
    #vswitch { order: 9; }
  }
</style>
</head>
<body>
<script>/*__FOLD__*/</script>

<div id="app">
  <header>
    <div class="brand">OpenCode Trajectory <small id="ver"></small></div>
    <div class="path" id="projpath"></div>
    <div class="vswitch" id="vswitch">
      <button data-v="traj" class="on">轨迹</button>
      <button data-v="chat">对话</button>
    </div>
    <div class="stats" id="topstats"></div>
    <button class="btn" id="reload">重新加载</button>
  </header>
  <aside id="sidebar"><div class="side-head"><span>会话</span><span id="sesscount"></span></div><div id="sesslist"></div></aside>
  <main id="main"><div class="empty">载入中…</div></main>
  <div class="replaybar" id="replaybar"></div>
</div>
<div class="drawer" id="drawer"></div>

<script id="traj-data" type="application/json">/*__DATA__*/</script>
<script>
(function () {
  "use strict";
  var FOLD = window.TrajFold;
  var SRC = FOLD.SOURCES || {};
  var state = {
    all: null,
    traj: null,
    sid: null,
    view: "traj",
    filter: "all",
    src: "all",
    q: "",
    open: new Set(),
    showAll: {},
    sel: null, // selected event index within the current session
    cursor: Infinity, // replay clock; Infinity = everything visible
    playing: false,
    speed: 4,
    raf: 0,
    clock0: 0,
    clockBase: 0,
  };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fmtTok(n) {
    if (n == null) return "0";
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "k";
    return String(n);
  }
  function fmtMs(ms) {
    if (ms == null || ms < 0) return "—";
    if (ms < 1000) return Math.round(ms) + "ms";
    if (ms < 60000) return (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + "s";
    var m = Math.floor(ms / 60000);
    return m + "m" + Math.round((ms % 60000) / 1000) + "s";
  }
  function fmtCost(c) {
    if (!c) return "$0";
    if (c < 0.01) return "$" + c.toFixed(4);
    return "$" + c.toFixed(2);
  }
  function fmtClock(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    var p = function (n) { return String(n).padStart(2, "0"); };
    return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  function badge(name) {
    var s = String(name || "?").replace(/[^a-zA-Z]/g, "");
    return (s.slice(0, 2) || "??").toUpperCase();
  }

  /* ---------- safe minimal rich text: paragraphs + fenced code + inline code ---------- */
  function richText(text, max) {
    var wrap = el("div", "txt");
    var shown = text;
    var truncated = false;
    if (max && text.length > max) { shown = text.slice(0, max); truncated = true; }
    paint(wrap, shown);
    if (truncated) {
      var btn = el("button", "more", "展开剩余 " + fmtTok(text.length - max) + " 字");
      btn.onclick = function () { wrap.innerHTML = ""; paint(wrap, text); btn.remove(); };
      wrap.appendChild(btn);
    }
    return wrap;
  }
  function paint(root, text) {
    var re = /```([a-zA-Z0-9_+-]*)\n([\s\S]*?)```/g;
    var last = 0, m;
    while ((m = re.exec(text))) {
      addPara(root, text.slice(last, m.index));
      var pre = el("pre");
      var code = el("code", null, m[2].replace(/\n$/, ""));
      pre.appendChild(code);
      root.appendChild(pre);
      last = re.lastIndex;
    }
    addPara(root, text.slice(last));
  }
  function addPara(root, chunk) {
    if (!chunk) return;
    chunk.split(/\n{2,}/).forEach(function (para) {
      if (!para) return;
      var p = el("p");
      var re = /`([^`\n]+)`/g, last = 0, m;
      while ((m = re.exec(para))) {
        if (m.index > last) p.appendChild(document.createTextNode(para.slice(last, m.index)));
        p.appendChild(el("code", null, m[1]));
        last = re.lastIndex;
      }
      if (last < para.length) p.appendChild(document.createTextNode(para.slice(last)));
      root.appendChild(p);
    });
  }

  /* ------------------------------- load ---------------------------------- */
  function readInline() {
    var node = document.getElementById("traj-data");
    var raw = node ? node.textContent.trim() : "";
    if (!raw || raw === "/*__DATA__*/") return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  async function load() {
    var inline = readInline();
    var records = [];
    var paths = [];
    if (inline && Array.isArray(inline.records)) {
      records = inline.records;
      if (inline.project) paths.push(inline.project);
    } else {
      var idx = await fetch("api/index").then(function (r) { return r.json(); });
      paths = idx.paths || [];
      document.getElementById("ver").textContent = idx.version ? "v" + idx.version : "";
      var sids = idx.sessions || [];
      var chunks = await Promise.all(sids.map(function (sid) {
        return fetch("api/journal?sid=" + encodeURIComponent(sid)).then(function (r) { return r.text(); });
      }));
      chunks.forEach(function (t) { records = records.concat(FOLD.parseJournal(t).records); });
    }
    state.all = FOLD.fold(records);
    state.traj = FOLD.trajectory(records);
    document.getElementById("projpath").textContent = paths.join("  ·  ");
    renderTop();
    renderSidebar();
    var first = state.all.roots.find(function (s) { return s.stats.messages > 0; }) || state.all.roots[0] || state.all.sessions[0];
    if (first) select(first.id);
    else document.getElementById("main").innerHTML = '<div class="empty">还没有轨迹记录。<br><code>用 opencode 跑一轮对话，然后点右上角「重新加载」</code></div>';
  }

  function renderTop() {
    var t = state.all.total;
    var box = document.getElementById("topstats");
    box.innerHTML = "";
    var items = [
      ["会话", state.all.sessions.length],
      ["输入", fmtTok(t.tokens.input)],
      ["输出", fmtTok(t.tokens.output)],
      ["缓存读", fmtTok(t.tokens.cacheRead)],
      ["工具", t.tools],
      ["成本", fmtCost(t.cost)],
      ["错误", t.errors, t.errors > 0],
    ];
    items.forEach(function (it) {
      var s = el("div", "stat" + (it[2] ? " bad" : ""));
      s.appendChild(el("b", null, String(it[1])));
      s.appendChild(document.createTextNode(it[0]));
      box.appendChild(s);
    });
  }

  function renderSidebar() {
    var list = document.getElementById("sesslist");
    list.innerHTML = "";
    document.getElementById("sesscount").textContent = state.all.sessions.length;
    function row(s, depth) {
      var d = el("div", "sess" + (state.sid === s.id ? " active" : ""));
      if (depth) { d.style.marginLeft = depth * 12 + "px"; }
      var title = el("div", "t", s.title || s.id);
      d.appendChild(title);
      var meta = el("div", "m");
      meta.appendChild(el("span", null, fmtClock(s.startedAt)));
      meta.appendChild(el("span", null, s.stats.turns + " 轮"));
      meta.appendChild(el("span", null, s.stats.tools + " 工具"));
      meta.appendChild(el("span", null, fmtTok(s.stats.tokens.input + s.stats.tokens.output)));
      if (s.stats.errors + s.stats.toolErrors > 0) meta.appendChild(el("span", "e", (s.stats.errors + s.stats.toolErrors) + " 错误"));
      if (s.stats.retries > 0) meta.appendChild(el("span", "w", s.stats.retries + " 重试"));
      d.appendChild(meta);
      d.onclick = function () { select(s.id); };
      list.appendChild(d);
      s.children.forEach(function (c) { row(c, depth + 1); });
    }
    state.all.roots.forEach(function (s) { row(s, 0); });
  }

  function select(sid) {
    state.sid = sid;
    state.open = new Set();
    state.showAll = {};
    stopPlay();
    state.sel = null;
    state.cursor = Infinity;
    closeDrawer();
    renderSidebar();
    renderMain();
    document.getElementById("main").scrollTop = 0;
  }

  /* ------------------------------- main ---------------------------------- */
  function currentSession() {
    return state.all.sessions.find(function (s) { return s.id === state.sid; });
  }

  function renderMain() {
    var main = document.getElementById("main");
    main.innerHTML = "";
    var s = currentSession();
    if (!s) return;
    if (state.view === "traj") renderTraj(s, main);
    else renderChat(s, main);
    renderReplay(s);
  }

  /* --------------------------- chat view (reading) -------------------------- */
  function renderChat(s, main) {
    main.appendChild(toolbar(s));

    var wf = waterfall(s);
    if (wf) main.appendChild(wf);

    s.messages.forEach(function (m) {
      var block = renderMessage(m, s);
      if (block) main.appendChild(block);
    });

    // standalone events (errors/retries/permissions with no message anchor)
    if (!s.messages.length) {
      var blank = el("div", "empty", "这个会话只有元数据，没有消息内容。");
      main.appendChild(blank);
    }
  }

  function toolbar(s) {
    var bar = el("div", "toolbar");
    var chips = [
      ["all", "全部"],
      ["tool", "工具"],
      ["reason", "思考"],
      ["error", "错误"],
    ];
    chips.forEach(function (c) {
      var b = el("button", "chip" + (state.filter === c[0] ? " on" : ""), c[1]);
      b.onclick = function () { state.filter = c[0]; renderMain(); };
      bar.appendChild(b);
    });
    var input = el("input", "search");
    input.placeholder = "搜索文本、工具名、参数…";
    input.value = state.q;
    var timer;
    input.oninput = function () {
      clearTimeout(timer);
      timer = setTimeout(function () { state.q = input.value.trim(); renderMain(); input.focus(); }, 180);
    };
    bar.appendChild(input);
    var info = el("span", "chip", s.stats.steps + " 步 · " + fmtMs(s.stats.durationMs) + " · " + fmtMs(s.stats.toolMs) + " 工具耗时");
    bar.appendChild(info);
    return bar;
  }

  function waterfall(s) {
    var tools = s.tools.filter(function (t) { return t.durMs != null && t.durMs > 0; });
    if (tools.length < 2) return null;
    var box = el("div", "waterfall");
    var head = el("div", "lbl");
    head.appendChild(el("span", null, "工具耗时"));
    head.appendChild(el("span", null, "总计 " + fmtMs(s.stats.toolMs)));
    box.appendChild(head);
    var sorted = tools.slice().sort(function (a, b) { return b.durMs - a.durMs; });
    var limit = state.showAll.wf ? sorted.length : Math.min(8, sorted.length);
    var max = sorted[0].durMs;
    sorted.slice(0, limit).forEach(function (t) {
      var row = el("div", "wf-row");
      row.appendChild(el("div", "n", t.tool));
      var track = el("div", "wf-track");
      var bar = el("div", "wf-bar" + (t.st === "error" ? " bad" : ""));
      bar.style.width = Math.max(1, (t.durMs / max) * 100) + "%";
      track.appendChild(bar);
      row.appendChild(track);
      row.appendChild(el("div", "d", fmtMs(t.durMs)));
      row.onclick = function () { jumpTo(t.pid); };
      row.style.cursor = "pointer";
      box.appendChild(row);
    });
    if (!state.showAll.wf && sorted.length > limit) {
      var more = el("button", "more", "还有 " + (sorted.length - limit) + " 个工具调用");
      more.onclick = function () { state.showAll.wf = true; renderMain(); };
      box.appendChild(more);
    }
    return box;
  }

  function jumpTo(pid) {
    state.filter = "all";
    state.q = "";
    renderMain();
    var node = document.querySelector('[data-pid="' + pid + '"]');
    if (node) {
      node.scrollIntoView({ behavior: "smooth", block: "center" });
      node.style.transition = "box-shadow .2s";
      node.style.boxShadow = "0 0 0 3px var(--accent-soft)";
      setTimeout(function () { node.style.boxShadow = ""; }, 1400);
    }
  }

  function matches(s, m, p) {
    if (state.filter === "tool" && p && p.type !== "tool") return false;
    if (state.filter === "reason" && p && p.type !== "reasoning") return false;
    if (state.filter === "error") {
      var bad = (m.error) || (p && p.type === "tool" && p.st === "error");
      if (!bad) return false;
    }
    if (!state.q) return true;
    var q = state.q.toLowerCase();
    var hay = [m.agent, m.modelID, p && p.type, p && p.tool, p && p.title, p && p.text, p && (typeof p.input === "string" ? p.input : JSON.stringify(p.input || "")), p && p.output]
      .filter(Boolean).join(" ").toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  function renderMessage(m, s) {
    var visible = m.parts.filter(function (p) { return matches(s, m, p); });
    if (!visible.length && state.filter !== "all") return null;
    if (!visible.length && state.q) return null;

    var box = el("div", "msg " + m.role);
    var head = el("div", "msg-head");
    head.appendChild(el("span", "role " + m.role, m.role === "user" ? "user" : "assistant"));
    if (m.agent) head.appendChild(el("span", null, m.agent));
    if (m.modelID) {
      head.appendChild(el("span", "sep", "·"));
      head.appendChild(el("span", null, (m.providerID ? m.providerID + "/" : "") + m.modelID));
    }
    head.appendChild(el("span", "sep", "·"));
    head.appendChild(el("span", null, fmtClock(m.created)));
    if (m.completed) {
      head.appendChild(el("span", "sep", "·"));
      head.appendChild(el("span", null, fmtMs(m.completed - m.created)));
    }
    if (m.tokens) {
      head.appendChild(el("span", "sep", "·"));
      head.appendChild(el("span", null, "in " + fmtTok(m.tokens.input) + " / out " + fmtTok(m.tokens.output) + (m.tokens.cacheRead ? " / cache " + fmtTok(m.tokens.cacheRead) : "")));
    }
    if (m.cost) { head.appendChild(el("span", "sep", "·")); head.appendChild(el("span", null, fmtCost(m.cost))); }
    if (m.finish) { head.appendChild(el("span", "sep", "·")); head.appendChild(el("span", null, m.finish)); }
    box.appendChild(head);

    if (m.error) {
      box.appendChild(note("err", "ERROR", m.error.name + ": " + m.error.message));
    }

    var body = el("div", "body");
    visible.forEach(function (p) {
      var node = renderPart(p, s, m);
      if (node) body.appendChild(node);
    });
    box.appendChild(body);
    return box;
  }

  function note(kind, tag, text, detail) {
    var n = el("div", "note " + kind);
    n.appendChild(el("span", "tag", tag));
    var wrap = el("div");
    wrap.appendChild(document.createTextNode(text));
    if (detail) {
      var d = el("div", "detail");
      d.textContent = typeof detail === "string" ? detail : JSON.stringify(detail, null, 2);
      wrap.appendChild(d);
    }
    n.appendChild(wrap);
    return n;
  }

  function renderPart(p, s, m) {
    if (p.type === "text") {
      var w = el("div", "part");
      if (p.syn) {
        var n = note("info", "CTX", "系统注入的上下文片段");
        n.appendChild(richText(p.text, 420));
        w.appendChild(n);
        return w;
      }
      w.appendChild(richText(p.text, 2400));
      return w;
    }

    if (p.type === "reasoning") {
      var box = el("div", "part reason");
      var key = s.id + ":" + p.pid;
      var open = state.open.has(key);
      var head = el("div", "fold-head" + (open ? " open" : ""));
      head.appendChild(el("span", "caret", "▶"));
      head.appendChild(el("span", null, "思考过程"));
      head.appendChild(el("span", "hint", fmtTok(p.text.length) + " 字" + (p.t1 && p.t0 ? " · " + fmtMs(p.t1 - p.t0) : "")));
      head.onclick = function () {
        if (state.open.has(key)) state.open.delete(key); else state.open.add(key);
        renderMain();
      };
      box.appendChild(head);
      if (open) {
        var body = el("div", "body");
        body.appendChild(richText(p.text, 8000));
        box.appendChild(body);
      }
      return box;
    }

    if (p.type === "tool") {
      var t = el("div", "part tool" + (p.st === "error" ? " err" : p.st === "running" ? " tool-run" : ""));
      t.setAttribute("data-pid", p.pid);
      var key2 = s.id + ":tool:" + p.pid;
      var isOpen = state.open.has(key2);
      var th = el("div", "tool-head");
      th.appendChild(el("div", "tbadge", badge(p.tool)));
      th.appendChild(el("div", "tname", p.tool));
      th.appendChild(el("div", "ttitle", p.title || summarizeInput(p.input)));
      var meta = el("div", "tmeta");
      if (p.durMs != null) meta.appendChild(el("span", null, fmtMs(p.durMs)));
      var st = p.st === "error" ? ["bad", "失败"] : p.st === "completed" ? ["ok", "完成"] : p.st === "running" ? ["run", "运行中"] : ["", "等待"];
      meta.appendChild(el("span", "pill " + st[0], st[1]));
      th.appendChild(meta);
      th.onclick = function () {
        if (state.open.has(key2)) state.open.delete(key2); else state.open.add(key2);
        renderMain();
      };
      t.appendChild(th);

      if (isOpen) {
        var tb = el("div", "tool-body");
        if (p.input !== undefined) {
          tb.appendChild(section("输入参数", pretty(p.input), p.clipped && p.clipped.input, p.callID));
        }
        if (p.output !== undefined) {
          tb.appendChild(section("返回", String(p.output), p.clipped && p.clipped.output, null));
        }
        if (p.error) tb.appendChild(note("err", "ERROR", p.error));
        tb.appendChild(section("定位", JSON.stringify({ messageID: m.id, partID: p.pid, callID: p.callID }, null, 0), false, null, true));
        t.appendChild(tb);
      }
      return t;
    }

    if (p.type === "step") {
      var line = el("div", "step-line");
      var bits = ["step " + (p.reason || p.ph)];
      if (p.tokens) bits.push("in " + fmtTok(p.tokens.input) + " · out " + fmtTok(p.tokens.output) + (p.tokens.reasoning ? " · think " + fmtTok(p.tokens.reasoning) : "") + (p.tokens.cacheRead ? " · cache " + fmtTok(p.tokens.cacheRead) : ""));
      if (p.cost) bits.push(fmtCost(p.cost));
      line.textContent = bits.join("  ·  ");
      return line;
    }

    if (p.type === "subtask") {
      var st2 = el("div", "part subtask");
      var h = el("div", "h");
      h.appendChild(el("span", null, "子 Agent · " + p.agent));
      if (p.description) h.appendChild(el("span", null, "— " + p.description));
      st2.appendChild(h);
      if (p.prompt) st2.appendChild(el("div", "p", p.prompt));
      var link = el("button", "more", "查看子会话轨迹 →");
      link.onclick = function () {
        var child = s.children[0];
        if (child) select(child.id);
      };
      if (s.children.length) st2.appendChild(link);
      return st2;
    }
    return null;
  }

  function summarizeInput(input) {
    if (input == null) return "";
    if (typeof input === "string") return input.slice(0, 120);
    var keys = Object.keys(input);
    if (input.filePath) return String(input.filePath);
    if (input.path) return String(input.path);
    if (input.command) return "$ " + String(input.command).slice(0, 120);
    if (input.pattern) return String(input.pattern);
    if (input.description) return String(input.description);
    return keys.slice(0, 3).map(function (k) {
      var v = input[k];
      return k + "=" + (typeof v === "string" ? v.slice(0, 40) : typeof v);
    }).join(" ");
  }

  function pretty(v) {
    if (typeof v === "string") return v;
    try { return JSON.stringify(v, null, 2); } catch (e) { return String(v); }
  }

  function section(label, text, clipped, copyValue, raw) {
    var s = el("div", "sec");
    var h = el("div", "sec-h");
    h.appendChild(el("span", null, label + (clipped ? "  （已截断）" : "")));
    if (copyValue) {
      var b = el("button", "copy", "复制");
      b.onclick = function () {
        navigator.clipboard && navigator.clipboard.writeText(copyValue);
        b.textContent = "已复制";
        setTimeout(function () { b.textContent = "复制"; }, 1200);
      };
      h.appendChild(b);
    }
    s.appendChild(h);
    var pre = el("pre", "pre" + (clipped ? " clip" : ""), text);
    s.appendChild(pre);
    return s;
  }

  /* ----------------------- trajectory view (auditing) ---------------------- */

  function trajOf(sid) {
    return state.traj && state.traj.bySid ? state.traj.bySid.get(sid) : null;
  }

  function tagOf(src) {
    return (SRC[src] && SRC[src].tag) || String(src || "?").toUpperCase().slice(0, 5);
  }

  /** Relative offset from session start: the trajectory reads as a tempo map. */
  function clockOf(t, t0) {
    if (!t) return "";
    if (!t0) return "+0.000";
    var d = (t - t0) / 1000;
    return (d < 0 ? "" : "+") + d.toFixed(3);
  }

  function clockAbs(t) {
    if (!t) return "";
    var d = new Date(t);
    var p = function (n, w) { return String(n).padStart(w || 2, "0"); };
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()) + "." + p(d.getMilliseconds(), 3);
  }

  function renderTraj(s, main) {
    var T = trajOf(s.id);
    if (!T || !T.events.length) {
      main.appendChild(el("div", "empty", "这个会话没有可展示的事件。"));
      return;
    }

    main.appendChild(trajToolbar(s, T));

    var stream = el("div", "stream");
    var shown = 0;
    T.events.forEach(function (e) {
      if (!evMatches(e)) return;
      stream.appendChild(eventRow(e, T));
      shown++;
    });
    if (!shown) {
      stream.appendChild(el("div", "empty", state.q ? "没有事件包含「" + state.q + "」" : "这个来源下没有事件"));
    }
    main.appendChild(stream);
    applyCursor();
  }

  function trajToolbar(s, T) {
    var bar = el("div", "toolbar");

    var all = el("button", "chip" + (state.src === "all" ? " on" : ""));
    all.appendChild(document.createTextNode("全部"));
    all.appendChild(el("span", "n", String(T.events.length)));
    all.onclick = function () { state.src = "all"; renderMain(); };
    bar.appendChild(all);

    T.stats.sources.forEach(function (src) {
      var b = el("button", "chip" + (state.src === src ? " on" : ""));
      b.appendChild(document.createTextNode((SRC[src] && SRC[src].zh) || src));
      b.appendChild(el("span", "n", String(T.stats.bySrc[src] || 0)));
      b.onclick = function () { state.src = state.src === src ? "all" : src; renderMain(); };
      bar.appendChild(b);
    });

    var input = el("input", "search");
    input.placeholder = "搜索事件、参数、返回…";
    input.value = state.q;
    var timer;
    input.oninput = function () {
      clearTimeout(timer);
      timer = setTimeout(function () { state.q = input.value.trim(); renderMain(); input.focus(); }, 180);
    };
    bar.appendChild(input);

    bar.appendChild(el("span", "chip", T.events.length + " 事件 · " + fmtMs(T.stats.durationMs) + " · 工具 " + fmtMs(T.stats.toolMs)));
    return bar;
  }

  function evMatches(e) {
    if (state.src !== "all" && e.src !== state.src) return false;
    if (!state.q) return true;
    var q = state.q.toLowerCase();
    var hay = [e.kind, e.text, e.note, e.ev, e.mid, e.pid, e.callID].filter(Boolean).join(" ").toLowerCase();
    if (hay.indexOf(q) !== -1) return true;
    try {
      return JSON.stringify(e.data || {}).toLowerCase().indexOf(q) !== -1;
    } catch (err) {
      return false;
    }
  }

  function eventRow(e, T) {
    var row = el("div", "ev src-" + e.src + (state.sel === e.i ? " on" : "") + (e.kind === "user.turn" ? " turn" : ""));
    row.setAttribute("data-ei", String(e.i));
    row.setAttribute("data-t", String(e.t || 0));

    row.appendChild(el("span", "seq", String(e.i)));
    row.appendChild(el("span", "tm", clockOf(e.t, T.startedAt)));
    row.appendChild(el("span", "tag src-" + e.src, tagOf(e.src)));

    var bd = el("div", "bd");
    bd.appendChild(el("span", "tx", e.text || "(空)"));
    if (e.note) bd.appendChild(el("span", "nt", e.note));
    row.appendChild(bd);

    var mt = el("div", "mt");
    mt.appendChild(el("span", "dur", e.dur != null ? fmtMs(e.dur) : ""));
    if (e.status === "err") mt.appendChild(el("span", "pill bad", "err"));
    else if (e.status === "run") mt.appendChild(el("span", "pill run", "run"));
    else if (e.status === "ok") mt.appendChild(el("span", "pill ok", "ok"));
    row.appendChild(mt);

    row.onclick = function () { openEvent(e, T); };
    return row;
  }

  /* ------------------------------- drawer -------------------------------- */

  function openEvent(e, T) {
    state.sel = e.i;
    var prev = document.querySelector(".ev.on");
    if (prev) prev.classList.remove("on");
    var row = document.querySelector('[data-ei="' + e.i + '"]');
    if (row) row.classList.add("on");
    renderDrawer(e, T);
    document.getElementById("drawer").classList.add("open");
  }

  function closeDrawer() {
    state.sel = null;
    var prev = document.querySelector(".ev.on");
    if (prev) prev.classList.remove("on");
    var d = document.getElementById("drawer");
    if (d) {
      d.classList.remove("open");
      d.innerHTML = "";
    }
  }

  function addKV(dl, k, v, copyable) {
    if (v == null || v === "") return;
    dl.appendChild(el("dt", null, k));
    var dd = el("dd", copyable ? "copyable" : null, String(v));
    if (copyable) {
      dd.title = "点击复制";
      dd.onclick = function () {
        if (navigator.clipboard) navigator.clipboard.writeText(String(v));
        dd.textContent = "已复制 " + v;
        setTimeout(function () { dd.textContent = String(v); }, 1000);
      };
    }
    dl.appendChild(dd);
  }

  function renderDrawer(e, T) {
    var d = document.getElementById("drawer");
    d.innerHTML = "";

    var head = el("div", "dh");
    head.appendChild(el("span", "tag src-" + e.src, tagOf(e.src)));
    head.appendChild(el("span", "k", e.kind || e.src));
    var x = el("button", "x", "×");
    x.title = "关闭";
    x.onclick = closeDrawer;
    head.appendChild(x);
    d.appendChild(head);

    var body = el("div", "db");

    var kv = el("dl", "kv");
    addKV(kv, "记录 seq", e.seqs && e.seqs.length ? e.seqs.join(", ") : "");
    addKV(kv, "发生时", clockAbs(e.t));
    addKV(kv, "相对", clockOf(e.t, T.startedAt) + "s");
    if (e.dur != null) addKV(kv, "耗时", fmtMs(e.dur));
    addKV(kv, "来源事件", e.ev);
    addKV(kv, "messageID", e.mid, true);
    addKV(kv, "partID", e.pid, true);
    addKV(kv, "callID", e.callID, true);
    body.appendChild(kv);

    var data = e.data || {};
    if (e.kind === "user.turn" && data.text) {
      body.appendChild(sectionTitle("用户输入"));
      body.appendChild(richText(data.text, 8000));
    } else if ((e.kind === "assistant.text" || e.kind === "llm.reasoning" || e.kind === "context.inject") && data.text != null) {
      body.appendChild(sectionTitle(e.kind === "llm.reasoning" ? "思考内容" : e.kind === "context.inject" ? "注入的上下文" : "模型输出"));
      body.appendChild(richText(data.text, 20000));
    } else if (e.kind === "tool.call") {
      body.appendChild(sectionTitle("调用参数"));
      body.appendChild(jsTree(data.input === undefined ? null : data.input));
    } else if (e.kind === "tool.result") {
      if (data.error) body.appendChild(note("err", "ERROR", String(data.error)));
      body.appendChild(sectionTitle("返回内容" + (data.clipped && data.clipped.output ? "（已截断）" : "")));
      if (data.output != null) {
        var pre = el("pre", "pre" + (data.clipped && data.clipped.output ? " clip" : ""), String(data.output));
        body.appendChild(pre);
      } else {
        body.appendChild(el("div", "z", "没有返回内容"));
      }
    } else if (e.kind === "llm.response" && data.tokens) {
      body.appendChild(sectionTitle("用量"));
      var tk = el("dl", "kv");
      addKV(tk, "input", String(data.tokens.input));
      addKV(tk, "output", String(data.tokens.output));
      addKV(tk, "reasoning", String(data.tokens.reasoning));
      addKV(tk, "cache read", String(data.tokens.cacheRead));
      addKV(tk, "cache write", String(data.tokens.cacheWrite));
      if (data.cost != null) addKV(tk, "cost", fmtCost(data.cost));
      addKV(tk, "finish", data.finish);
      body.appendChild(tk);
      body.appendChild(sectionTitle("原始字段"));
      body.appendChild(jsTree(data));
    } else {
      body.appendChild(sectionTitle("事件载荷"));
      body.appendChild(jsTree(data));
    }

    // A spawned sub-agent runs its own session with its own journal. Without a
    // hop here, its events are unreachable from the audit trail.
    if (e.kind === "agent.spawn") {
      var kids = state.all.sessions.filter(function (x) { return x.parentID === T.sid; });
      if (kids.length) {
        body.appendChild(sectionTitle("子会话轨迹"));
        kids.forEach(function (kid) {
          var b = el("button", "copy", "→ " + (kid.title || kid.id));
          b.style.marginRight = "6px";
          b.onclick = function () { select(kid.id); };
          body.appendChild(b);
        });
      }
    }

    // Everything the record layer knows about this event, for copy-out.
    body.appendChild(sectionTitle("分叉锚点"));
    var anchorHint = el("div", "z", "复制后可在新会话里定位到同一节点。真正的分支需要服务端写操作，本工具只读。");
    anchorHint.style.fontSize = "11px";
    anchorHint.style.color = "var(--faint)";
    anchorHint.style.marginBottom = "6px";
    body.appendChild(anchorHint);
    var anchor = {
      sessionID: T.sid,
      messageID: e.mid || null,
      partID: e.pid || null,
      callID: e.callID || null,
      snapshot: (e.kind && e.kind.indexOf("llm.step") === 0 && data.snapshot) || null,
      at: e.t || null,
      event: e.kind || null,
    };
    var copyBtn = el("button", "copy", "复制锚点 JSON");
    copyBtn.onclick = function () {
      var txt = JSON.stringify(anchor, null, 2);
      if (navigator.clipboard) navigator.clipboard.writeText(txt);
      copyBtn.textContent = "已复制";
      setTimeout(function () { copyBtn.textContent = "复制锚点 JSON"; }, 1200);
    };
    body.appendChild(copyBtn);

    d.appendChild(body);
  }

  function sectionTitle(t) {
    var h = el("div", "sec-h", t);
    h.style.marginTop = "4px";
    return h;
  }

  /* --------------------------- json folding tree -------------------------- */

  function jsTree(value) {
    var wrap = el("div", "js");
    if (value === undefined) {
      wrap.appendChild(el("div", "z", "(没有数据)"));
      return wrap;
    }
    wrap.appendChild(jsNode(value, "", 0));
    return wrap;
  }

  function jsLeaf(v) {
    if (v === null) return el("span", "z", "null");
    if (typeof v === "number") return el("span", "n", String(v));
    if (typeof v === "boolean") return el("span", "b", String(v));
    var s = String(v);
    var span = el("span", "s", JSON.stringify(s.length > 2000 ? s.slice(0, 2000) + "…" : s));
    return span;
  }

  function jsNode(v, key, depth) {
    var isArr = Array.isArray(v);
    var isObj = v != null && typeof v === "object";
    var row = el("div", "row");
    var caret = el("span", "caret", " ");
    row.appendChild(caret);

    var line = el("span");
    if (key !== "") {
      line.appendChild(el("span", "k", isArr ? key : JSON.stringify(key)));
      line.appendChild(el("span", "z", ": "));
    }

    if (!isObj) {
      line.appendChild(jsLeaf(v));
      row.appendChild(line);
      return row;
    }

    var keys = isArr ? v.map(function (_, i) { return i; }) : Object.keys(v);
    line.appendChild(el("span", "z", (isArr ? "[" + keys.length + "]" : "{" + keys.length + "}")));
    row.appendChild(line);
    if (!keys.length) return row;

    var box = el("div");
    box.appendChild(row);

    var kids = el("div", "kids");
    keys.forEach(function (k) {
      kids.appendChild(jsNode(v[k], String(k), depth + 1));
    });
    box.appendChild(kids);

    var open = depth < 2;
    kids.style.display = open ? "" : "none";
    caret.textContent = open ? "▾" : "▸";
    caret.onclick = function (ev) {
      ev.stopPropagation();
      var isOpen = kids.style.display !== "none";
      kids.style.display = isOpen ? "none" : "";
      caret.textContent = isOpen ? "▸" : "▾";
    };
    return box;
  }

  /* -------------------------------- replay -------------------------------- */

  function renderReplay(s) {
    var bar = document.getElementById("replaybar");
    bar.innerHTML = "";
    var T = trajOf(s.id);
    if (state.view !== "traj" || !T || T.events.length < 2) {
      bar.classList.add("hidden");
      return;
    }
    bar.classList.remove("hidden");

    var play = el("button", "pl", state.playing ? "❚❚" : "▶");
    play.title = state.playing ? "暂停" : "回放";
    play.onclick = togglePlay;
    bar.appendChild(play);

    var range = document.createElement("input");
    range.type = "range";
    range.min = "0";
    range.max = "1000";
    range.step = "1";
    range.value = "1000";
    range.oninput = function () {
      stopPlay();
      var span = Math.max(1, T.endedAt - T.startedAt);
      var v = Number(range.value);
      state.cursor = v >= 1000 ? Infinity : T.startedAt + (v / 1000) * span;
      applyCursor();
      syncReplay();
    };
    bar.appendChild(range);

    var sp = el("div", "sp");
    [1, 4, 16].forEach(function (x) {
      var b = el("button", state.speed === x ? "on" : "", x + "x");
      b.onclick = function () {
        state.speed = x;
        // restart the clock base so the speed change is seamless
        if (state.playing) {
          state.clockBase = state.cursor === Infinity ? T.startedAt : state.cursor;
          state.clock0 = performance.now();
        }
        renderReplay(s);
      };
      sp.appendChild(b);
    });
    bar.appendChild(sp);

    var cnt = el("div", "cnt");
    cnt.id = "replaycount";
    bar.appendChild(cnt);
    syncReplay();
  }

  function applyCursor() {
    var rows = document.querySelectorAll(".ev[data-t]");
    for (var i = 0; i < rows.length; i++) {
      var t = Number(rows[i].getAttribute("data-t"));
      rows[i].style.display = state.cursor === Infinity || t <= state.cursor ? "" : "none";
    }
  }

  function syncReplay() {
    var T = trajOf(state.sid);
    if (!T) return;
    var range = document.querySelector("#replaybar input[type=range]");
    var span = Math.max(1, T.endedAt - T.startedAt);
    if (range) {
      range.value = state.cursor === Infinity ? "1000" : String(Math.max(0, Math.min(1000, ((state.cursor - T.startedAt) / span) * 1000)));
    }
    var cnt = document.getElementById("replaycount");
    if (cnt) {
      var n = 0;
      for (var i = 0; i < T.events.length; i++) if (state.cursor === Infinity || T.events[i].t <= state.cursor) n++;
      cnt.textContent = n + " / " + T.events.length + " · " + (state.cursor === Infinity ? "全部" : clockOf(state.cursor, T.startedAt));
    }
    var play = document.querySelector("#replaybar .pl");
    if (play) play.textContent = state.playing ? "❚❚" : "▶";
  }

  function togglePlay() {
    if (state.playing) {
      stopPlay();
      return;
    }
    var T = trajOf(state.sid);
    if (!T) return;
    if (state.cursor === Infinity || state.cursor >= T.endedAt) state.cursor = T.startedAt;
    state.clockBase = state.cursor;
    state.clock0 = performance.now();
    state.playing = true;
    applyCursor();
    syncReplay();
    var s = currentSession();
    if (s) renderReplay(s);
    state.raf = requestAnimationFrame(tickPlay);
  }

  function stopPlay() {
    state.playing = false;
    if (state.raf) {
      cancelAnimationFrame(state.raf);
      state.raf = 0;
    }
    var play = document.querySelector("#replaybar .pl");
    if (play) play.textContent = "▶";
  }

  function tickPlay() {
    if (!state.playing) return;
    var T = trajOf(state.sid);
    if (!T) {
      stopPlay();
      return;
    }
    state.cursor = state.clockBase + (performance.now() - state.clock0) * state.speed;
    if (state.cursor >= T.endedAt) {
      state.cursor = Infinity;
      state.playing = false;
      applyCursor();
      var s = currentSession();
      if (s) renderReplay(s);
      return;
    }
    applyCursor();
    syncReplay();
    scrollToLatest();
    state.raf = requestAnimationFrame(tickPlay);
  }

  function scrollToLatest() {
    var rows = document.querySelectorAll(".ev[data-t]");
    for (var i = rows.length - 1; i >= 0; i--) {
      if (rows[i].style.display !== "none") {
        if (rows[i].scrollIntoView) rows[i].scrollIntoView({ block: "nearest" });
        return;
      }
    }
  }

  /* ------------------------------ wiring --------------------------------- */
  [].forEach.call(document.querySelectorAll("#vswitch button"), function (b) {
    b.onclick = function () {
      var v = b.getAttribute("data-v");
      if (state.view === v) return;
      state.view = v;
      [].forEach.call(document.querySelectorAll("#vswitch button"), function (o) {
        o.classList.toggle("on", o === b);
      });
      stopPlay();
      closeDrawer();
      renderMain();
    };
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") closeDrawer();
  });

  document.getElementById("reload").onclick = function () {
    document.getElementById("main").innerHTML = '<div class="empty">重新加载中…</div>';
    load().catch(function (e) {
      document.getElementById("main").innerHTML = "";
      document.getElementById("main").appendChild(note("err", "ERROR", "加载失败", String(e && e.message || e)));
    });
  };

  load().catch(function (e) {
    var main = document.getElementById("main");
    main.innerHTML = "";
    main.appendChild(note("err", "ERROR", "无法读取轨迹", String(e && e.message || e)));
  });
})();
</script>
</body>
</html>
